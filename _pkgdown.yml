  - inv_gompertz4
  - inv_logistic4
  - inv_logistic5
  - inv_loglogistic4
  - inv_loglogistic5

- title: Derivatives & Gradients
  desc: Analytical derivatives and gradient vectors.
  contents:
  - dydx_gompertz4
  - dydx_logistic4
  - dydx_logistic5
  - dydx_loglogistic4
  - dydx_loglogistic5
