  - d2x_loglogistic4
  - d2x_loglogistic5
  - grad_gompertz4
  - grad_logistic4
  - grad_logistic5
  - grad_loglogistic4
  - grad_loglogistic5
  - make_inv_and_grad_fixed

- title: Example data sets
  desc: Data from immune assays
  contents:
  - bead_assay_example
  - elisa_assay_example

- title: Utilities
  desc: Internal helpers and shared utilities.
