url: https://immunoplex.github.io/curveRcore/

template:
  bootstrap: 5
  bootswatch: flatly

reference:
- title: Models & mathematics
  desc: "Nonlinear sigmoidal regression models"
  contents:
  - starts_with("logistic")
  - starts_with("gompertz")
  - starts_with("inv_")
  - starts_with("dydx_")
  - starts_with("d2x_")
  - starts_with("grad_")
  - make_inv_and_grad_fixed
  - available_models

- title: Preprocessing
  desc: "Preprocessing assay data"
  contents:
  - preprocess_standards
  - compute_concentration
  - correct_prozone
  - compute_log_response
  - resolve_fixed_lower_asymptote
  - adaptive_constraint_profile

- title: Model selection
  desc: "Algorithms for selecting regression models"
  contents:
  - assess_model_eligibility
  - select_best_eligible

- title: Output class & comparison
  desc: "Calibration result data schema"
  contents:
  - new_calibration_result
  - new_calibration_result_multiplate
  - compare_calibrations
  - compare_parameters
  - compare_samples
  - agreement_metrics

- title: Tidy extractors
  desc: "Sample and grid functions to harmonize data"
  contents:
  - tidy_samples
  - tidy_grid

navbar:
  title: "curveRcore"
  logo:
    image: man/figures/logo.png   # <-- sticker appears in navbar
    href: index.html
  structure:
    left:
      - intro
      - reference
      - articles
    right:
      - search
      - github
  components:
    github:
      icon: fa-github
      href: https://github.com/immunoplex/curveR

home:
  title: "curveRcore"
  description: "Shared models, inverses, gradients and output classes for the curveR immunoassay ecosystem"

  # Logo on homepage
  sidebar:
    structure: [links, license, community, citation, authors, dev]

authors:
  sidebar:
    roles: [aut, cre]

articles:
  - title: "Standard curve model forms"
    contents:
      - model-forms
